<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="topbar">
        <a class="brand" href="/">
            <span class="mark">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </span>
            Music Manager
        </a>
        <div class="topbar-actions">
            <div class="search-field">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="librarySearch" placeholder="Search albums or artists..." onkeyup="filterLibrary()">
            </div>
            <a href="/" class="btn">← Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="gallery-header">
            <h1>Library</h1>
        </div>

        {% if albums|length == 0 %}
        <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <p>No albums yet. Run a Sync from the Dashboard once you've downloaded some music.</p>
        </div>
        {% endif %}

        <div class="album-grid" id="albumGrid">
            {% for album in albums %}
            <div class="album-item" id="album-container-{{ album.album_id }}">
                <div class="card album-card">
                    <button class="menu-dots" onclick="toggleMenu(event, '{{ album.album_id }}')">
                        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
                    </button>

                    <div id="menu-{{ album.album_id }}" class="delete-menu">
                        <div class="delete-item" onclick="removeAlbum('{{ album.album_id }}', '{{ album.album_name|escape }}')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                            Delete Album
                        </div>
                    </div>

                    <a href="/album/{{ album.album_id }}" class="album-link">
                        <div class="album-cover-wrap">
                            <img src="{{ url_for('static', filename='covers/' ~ album.album_id ~ '.jpg') }}"
                                 alt="{{ album.album_name }}"
                                 onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%2317171b%22/><path d=%22M35 65V32l30-5v33%22 stroke=%22%233a3a40%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><circle cx=%2230%22 cy=%2265%22 r=%226%22 stroke=%22%233a3a40%22 stroke-width=%223%22 fill=%22none%22/><circle cx=%2260%22 cy=%2260%22 r=%226%22 stroke=%22%233a3a40%22 stroke-width=%223%22 fill=%22none%22/></svg>'">
                        </div>
                        <div class="album-info">
                            <div class="album-name">{{ album.album_name }}</div>
                            <div class="artist-name">{{ album.artist_name }}</div>
                            <div class="album-year">{{ album.release_date }}</div>
                        </div>
                    </a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <script>
        function toggleMenu(event, albumId) {
            event.preventDefault();
            event.stopPropagation();

            document.querySelectorAll('.delete-menu').forEach(menu => {
                if (menu.id !== `menu-${albumId}`) menu.classList.remove('show');
            });

            const menu = document.getElementById(`menu-${albumId}`);
            menu.classList.toggle('show');
        }

        window.onclick = function(event) {
            if (!event.target.closest('.menu-dots')) {
                document.querySelectorAll('.delete-menu').forEach(menu => {
                    menu.classList.remove('show');
                });
            }
        }

        function removeAlbum(albumId, albumName) {
            if (confirm(`Delete entire album "${albumName}"?`)) {
                fetch(`/delete_album/${albumId}`, { method: 'DELETE' })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        const element = document.getElementById(`album-container-${albumId}`);
                        element.style.opacity = "0";
                        setTimeout(() => element.remove(), 400);
                    }
                });
            }
        }

        function filterLibrary() {
            const input = document.getElementById('librarySearch').value.toLowerCase();
            const albums = document.getElementsByClassName('album-item');
            for (let i = 0; i < albums.length; i++) {
                const title = albums[i].querySelector('.album-name').innerText.toLowerCase();
                const artist = albums[i].querySelector('.artist-name').innerText.toLowerCase();
                if (title.includes(input) || artist.includes(input)) {
                    albums[i].style.display = "";
                } else {
                    albums[i].style.display = "none";
                }
            }
        }
    </script>
</body>
</html>
