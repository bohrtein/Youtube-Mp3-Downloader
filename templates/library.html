<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000400">
    <meta name="color-scheme" content="dark">
    <title>Music Library</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='matrix.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <script src="{{ url_for('static', filename='matrix.js') }}" defer></script>
</head>
<body class="mx">

<canvas id="mx-rain-bloom" aria-hidden="true"></canvas>
<canvas id="mx-rain" aria-hidden="true"></canvas>
<div class="mx-vignette" aria-hidden="true"></div>
<div class="mx-scanlines" aria-hidden="true"></div>

<div class="mx-shell">

    <div class="mx-topbar">
        <div class="mx-brand">
            <span class="mx-mark">music manager</span>
            <p class="mx-tagline">library</p>
        </div>
        <a class="mx-btn" href="{{ url_for('main_dashboard') }}">Dashboard</a>
    </div>

    <div class="mx-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="mx-input" type="text" id="librarySearch" placeholder="Search albums or artists..." onkeyup="filterLibrary()">
    </div>

    {% if albums|length == 0 %}
    <div class="mx-empty" style="text-align:center; padding:60px 20px; font-size:13px;">
        No albums yet. Run a Sync from the Dashboard once you've downloaded some music.
    </div>
    {% endif %}

    <div class="mx-album-list" id="albumGrid">
        {% for album in albums %}
        <div class="album-item" id="album-container-{{ album.album_id }}">
            <div class="mx-row mx-album-row">
                <a class="mx-album-row-link" href="{{ url_for('album_detail', album_id=album.album_id) }}">
                    <span class="mx-album-thumb">
                        <img src="{{ url_for('static', filename='covers/' ~ album.album_id ~ '.jpg') }}"
                             alt="{{ album.album_name }}"
                             onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%2303150c%22/><path d=%22M35 65V32l30-5v33%22 stroke=%22%232c6042%22 stroke-width=%223%22 fill=%22none%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/><circle cx=%2230%22 cy=%2265%22 r=%226%22 stroke=%22%232c6042%22 stroke-width=%223%22 fill=%22none%22/><circle cx=%2260%22 cy=%2260%22 r=%226%22 stroke=%22%232c6042%22 stroke-width=%223%22 fill=%22none%22/></svg>'">
                    </span>
                    <span class="mx-album-row-text">
                        <span class="mx-album-name">{{ album.album_name }}</span>
                        <span class="mx-album-row-sub"><span class="mx-album-artist">{{ album.artist_name }}</span> · <span class="mx-album-year">{{ album.release_date }}</span></span>
                    </span>
                </a>
                <div class="mx-album-menu-wrap">
                    <button class="mx-dots-btn" type="button" aria-label="Album actions" onclick="toggleMenu(event, '{{ album.album_id }}')">
                        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg>
                    </button>
                    <div id="menu-{{ album.album_id }}" class="mx-menu-popover">
                        <button class="mx-menu-item" type="button" onclick="removeAlbum('{{ album.album_id }}', '{{ album.album_name|escape }}')">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
                            Delete Album
                        </button>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

</div>

<div class="mx-toasts" id="toastHost"></div>

<script>
    // See main.html for why this exists: makes fetch() calls below work
    // both standalone and proxied under the app hub's path prefix.
    const APP_ROOT = "{{ request.script_root }}";

    function toggleMenu(event, albumId) {
        event.preventDefault();
        event.stopPropagation();

        document.querySelectorAll('.mx-menu-popover').forEach(menu => {
            if (menu.id !== `menu-${albumId}`) menu.classList.remove('mx-open');
        });

        const menu = document.getElementById(`menu-${albumId}`);
        menu.classList.toggle('mx-open');
    }

    window.onclick = function(event) {
        if (!event.target.closest('.mx-dots-btn')) {
            document.querySelectorAll('.mx-menu-popover').forEach(menu => {
                menu.classList.remove('mx-open');
            });
        }
    }

    function removeAlbum(albumId, albumName) {
        if (confirm(`Delete entire album "${albumName}"?`)) {
            fetch(`${APP_ROOT}/delete_album/${albumId}`, { method: 'DELETE' })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    const element = document.getElementById(`album-container-${albumId}`);
                    element.style.opacity = "0";
                    setTimeout(() => element.remove(), 400);
                } else {
                    MX.toast(false, data.message || 'Could not delete that album.', document.getElementById('toastHost'));
                }
            })
            .catch(() => MX.toast(false, 'Failed to delete album.', document.getElementById('toastHost')));
        }
    }

    function filterLibrary() {
        const input = document.getElementById('librarySearch').value.toLowerCase();
        const albums = document.getElementsByClassName('album-item');
        for (let i = 0; i < albums.length; i++) {
            const title = albums[i].querySelector('.mx-album-name').innerText.toLowerCase();
            const artist = albums[i].querySelector('.mx-album-artist').innerText.toLowerCase();
            if (title.includes(input) || artist.includes(input)) {
                albums[i].style.display = "";
            } else {
                albums[i].style.display = "none";
            }
        }
    }
</script>
</body>
</html>
