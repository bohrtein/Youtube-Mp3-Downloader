<div class="mx-dock" id="progressContainer" role="status" aria-live="polite" hidden>
    <span class="mx-dock-icon">{{ mx.icon("music") }}</span>
    <span class="mx-dock-main">
        <span class="mx-dock-title" id="statusText">Waiting for task…</span>
        <span class="mx-dock-sub" id="statusDetail">Queued</span>
    </span>
    <span class="mx-dock-value" id="statusPercent"></span>
    <button class="mx-btn" type="button" id="cancelJob" hidden>Cancel</button>
</div>
