<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#000400">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <title>{% block title %}Music Manager{% endblock %}</title>
    {% import "matrix/macros.html" as mx %}
    {{ mx.head(mx_live, mx_local) }}
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='suggest.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
    {% block head %}{% endblock %}
</head>
<body class="mx" {% block body_attrs %}{% endblock %}>

<div class="mx-shell">
{% block content %}{% endblock %}
</div>

<div class="mx-toasts" id="toastHost"></div>
{% block scripts %}{% endblock %}
</body>
</html>
